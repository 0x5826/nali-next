name: Go Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-binary:
    name: Release Binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build releases
        env:
          NAME: nali
          BINDIR: bin
        run: |
          make -j releases
          make sha256sum

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nali-binaries
          path: bin/*
          retention-days: 7
